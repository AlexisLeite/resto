server {
    listen 100.111.171.20:27777 ssl;
    server_name devmachine.tail31d281.ts.net;

    ssl_certificate /etc/nginx/tls/resto-tsnet/server.crt;
    ssl_certificate_key /etc/nginx/tls/resto-tsnet/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 =308 https://devmachine.tail31d281.ts.net:27777$request_uri;

    access_log /var/log/nginx/resto-tailscale.access.log;
    error_log /var/log/nginx/resto-tailscale.error.log;

    location / {
        proxy_pass http://127.0.0.1:27778;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}

server {
    listen 100.111.171.20:27777 ssl default_server;
    server_name 100.111.171.20;
    ssl_certificate /etc/nginx/tls/resto-tailscale/server.crt;
    ssl_certificate_key /etc/nginx/tls/resto-tailscale/server.key;
    error_page 497 =308 https://devmachine.tail31d281.ts.net:27777$request_uri;
    return 308 https://devmachine.tail31d281.ts.net:27777$request_uri;
}
